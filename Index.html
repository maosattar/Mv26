<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mv26 — Daily Habits</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #eeede9;
    --border: #e4e2dc;
    --accent: #1a1a1a;
    --accent-green: #2d6a4f;
    --accent-green-light: #d8f3dc;
    --text: #1a1a1a;
    --muted: #9e9b94;
    --muted2: #c8c5bc;
  }

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
background: var(–bg);
color: var(–text);
font-family: ‘Manrope’, sans-serif;
min-height: 100vh;
padding-bottom: 100px;
}

header {
padding: 56px 24px 20px;
}

.date-label {
font-size: 12px;
font-weight: 500;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 6px;
}

h1 {
font-size: 36px;
font-weight: 800;
line-height: 1.05;
letter-spacing: -0.02em;
color: var(–text);
}

h1 span { color: var(–accent-green); }

.streak-bar {
display: flex;
gap: 8px;
margin-top: 18px;
align-items: center;
}

.streak-pill {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 100px;
padding: 7px 14px;
font-size: 13px;
font-weight: 600;
color: var(–muted);
display: flex;
align-items: center;
gap: 5px;
}

.streak-pill .num {
font-size: 15px;
font-weight: 800;
color: var(–text);
letter-spacing: -0.02em;
}

.progress-wrap {
padding: 4px 24px 0;
}

.progress-label {
display: flex;
justify-content: space-between;
font-size: 11px;
font-weight: 600;
color: var(–muted);
margin-bottom: 8px;
letter-spacing: 0.06em;
text-transform: uppercase;
}

.progress-track {
height: 3px;
background: var(–border);
border-radius: 10px;
overflow: hidden;
}

.progress-fill {
height: 100%;
background: var(–accent-green);
border-radius: 10px;
transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.section-label {
font-size: 11px;
font-weight: 700;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(–muted);
padding: 24px 24px 10px;
}

.habits-list {
padding: 0 16px;
display: flex;
flex-direction: column;
gap: 6px;
}

.habit-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 14px 16px;
display: flex;
align-items: center;
gap: 13px;
cursor: pointer;
transition: all 0.18s ease;
position: relative;
overflow: hidden;
user-select: none;
}

.habit-card::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 3px;
background: var(–color);
border-radius: 3px 0 0 3px;
opacity: 0;
transition: opacity 0.3s;
}

.habit-card.done::before { opacity: 1; }

.habit-card.done {
background: color-mix(in srgb, var(–color) 6%, var(–surface));
border-color: color-mix(in srgb, var(–color) 25%, var(–border));
}

.habit-card:active { transform: scale(0.985); }

.check-circle {
width: 26px;
height: 26px;
border-radius: 50%;
border: 1.5px solid var(–muted2);
flex-shrink: 0;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
background: transparent;
}

.habit-card.done .check-circle {
background: var(–color);
border-color: var(–color);
transform: scale(1.08);
}

.check-circle svg {
opacity: 0;
transform: scale(0);
transition: all 0.18s ease;
}

.habit-card.done .check-circle svg {
opacity: 1;
transform: scale(1);
}

.habit-info { flex: 1; min-width: 0; }

.habit-name {
font-size: 14px;
font-weight: 600;
color: var(–text);
line-height: 1.2;
letter-spacing: -0.01em;
}

.habit-card.done .habit-name {
color: var(–muted);
text-decoration: line-through;
text-decoration-color: var(–muted2);
}

.habit-meta {
font-size: 11px;
font-weight: 500;
color: var(–muted);
margin-top: 2px;
}

.habit-emoji {
font-size: 20px;
flex-shrink: 0;
width: 32px;
height: 32px;
display: flex;
align-items: center;
justify-content: center;
background: var(–surface2);
border-radius: 8px;
}

/* Weekly dots */
.week-dots {
display: flex;
gap: 3px;
margin-top: 7px;
}

.dot {
width: 5px;
height: 5px;
border-radius: 50%;
background: var(–border);
}

.dot.filled { background: var(–color); }
.dot.today { background: transparent; border: 1.5px solid var(–color); }

/* Confetti burst */
@keyframes burst {
0% { transform: scale(0) rotate(0deg); opacity: 1; }
100% { transform: scale(3) rotate(180deg); opacity: 0; }
}

.burst {
position: fixed;
pointer-events: none;
z-index: 1000;
font-size: 22px;
animation: burst 0.55s ease-out forwards;
}

/* All done banner */
.all-done {
margin: 12px 16px 0;
background: var(–accent-green-light);
border: 1px solid color-mix(in srgb, var(–accent-green) 20%, transparent);
border-radius: 14px;
padding: 18px 20px;
text-align: center;
display: none;
}

.all-done.show { display: block; }

.all-done-title {
font-size: 17px;
font-weight: 800;
color: var(–accent-green);
letter-spacing: -0.01em;
}

.all-done-sub {
font-size: 12px;
font-weight: 500;
color: color-mix(in srgb, var(–accent-green) 70%, black);
margin-top: 3px;
}

/* Bottom nav */
.bottom-nav {
position: fixed;
bottom: 0; left: 0; right: 0;
background: color-mix(in srgb, var(–bg) 92%, transparent);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border-top: 1px solid var(–border);
display: flex;
padding: 12px 0 28px;
}

.nav-btn {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
background: none;
border: none;
cursor: pointer;
color: var(–muted);
font-family: ‘Manrope’, sans-serif;
font-size: 10px;
font-weight: 600;
letter-spacing: 0.06em;
text-transform: uppercase;
padding: 4px 0;
transition: color 0.18s;
}

.nav-btn.active { color: var(–accent-green); }
.nav-btn svg { width: 20px; height: 20px; }

/* Views */
.view { display: none; }
.view.active { display: block; }

/* Stats view */
.stats-grid {
padding: 0 16px;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
}

.stat-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 18px 16px;
}

.stat-num {
font-size: 40px;
font-weight: 800;
line-height: 1;
color: var(–text);
letter-spacing: -0.03em;
}

.stat-label {
font-size: 11px;
font-weight: 600;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 0.08em;
margin-top: 4px;
}

.habit-history {
padding: 0 16px;
display: flex;
flex-direction: column;
gap: 8px;
}

.history-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 14px 16px;
}

.history-top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
}

.history-name {
font-size: 13px;
font-weight: 600;
display: flex;
align-items: center;
gap: 8px;
color: var(–text);
letter-spacing: -0.01em;
}

.history-streak {
font-size: 20px;
font-weight: 800;
color: var(–accent-green);
letter-spacing: -0.02em;
}

.week-bar {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 4px;
}

.week-bar-day {
aspect-ratio: 1;
border-radius: 6px;
background: var(–surface2);
display: flex;
align-items: center;
justify-content: center;
font-size: 9px;
font-weight: 600;
color: var(–muted);
flex-direction: column;
gap: 1px;
}

.week-bar-day.filled {
color: white;
}

.week-bar-day .day-letter {
font-size: 8px;
text-transform: uppercase;
opacity: 0.7;
font-weight: 700;
}

@keyframes slideUp {
from { opacity: 0; transform: translateY(16px); }
to { opacity: 1; transform: translateY(0); }
}

.habit-card {
animation: slideUp 0.35s ease both;
}

.habit-card:nth-child(1) { animation-delay: 0.04s; }
.habit-card:nth-child(2) { animation-delay: 0.08s; }
.habit-card:nth-child(3) { animation-delay: 0.12s; }
.habit-card:nth-child(4) { animation-delay: 0.16s; }
.habit-card:nth-child(5) { animation-delay: 0.20s; }
.habit-card:nth-child(6) { animation-delay: 0.24s; }
.habit-card:nth-child(7) { animation-delay: 0.28s; }
.habit-card:nth-child(8) { animation-delay: 0.32s; }
.habit-card:nth-child(9) { animation-delay: 0.36s; }
.habit-card:nth-child(10) { animation-delay: 0.40s; }
</style>

</head>
<body>

<!-- TODAY VIEW -->

<div class="view active" id="view-today">
  <header>
    <div class="date-label" id="date-label"></div>
    <h1>MV<span>26</span></h1>
    <div class="streak-bar">
      <div class="streak-pill">
        <span class="num" id="total-streak">0</span> day streak
      </div>
      <div class="streak-pill">
        <span class="num" id="done-count">0</span>/<span id="total-count">0</span> today
      </div>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>Daily Progress</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="all-done" id="all-done-banner">
    <div class="all-done-title">🔥 ALL DONE!</div>
    <div class="all-done-sub">Every habit checked. You're building something real.</div>
  </div>

  <div class="section-label">Today's Habits</div>
  <div class="habits-list" id="habits-list"></div>
</div>

<!-- STATS VIEW -->

<div class="view" id="view-stats">
  <header>
    <div class="date-label">Your Progress</div>
    <h1>STATS <span>&</span> STREAKS</h1>
  </header>

  <div class="stats-grid" id="stats-grid"></div>

  <div class="section-label" style="margin-top:8px;">Habit Breakdown — Last 7 Days</div>
  <div class="habit-history" id="habit-history"></div>
</div>

<!-- Bottom Nav -->

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-today" onclick="switchView('today')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Today
  </button>
  <button class="nav-btn" id="nav-stats" onclick="switchView('stats')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-6"/></svg>
    Stats
  </button>
</nav>

<script>
const HABITS = [
  { id: 'walk-am',     name: 'Morning Walk',         meta: '6:30 – 7:00am · 30 min',        emoji: '☀️', color: '#e07b39', days: 'daily' },
  { id: 'walk-pm',     name: 'Evening Walk',          meta: '4:00 – 4:30pm · 30 min',        emoji: '🌇', color: '#3a7bd5', days: 'daily' },
  { id: 'strength',    name: 'Strength Training',     meta: '12:00pm · 45 min · Mon/Wed/Fri', emoji: '💪', color: '#2d6a4f', days: [1,3,5] },
  { id: 'no-booze',    name: 'Alcohol-Free Day',      meta: 'Pick your NA drink instead',     emoji: '🍹', color: '#c2436a', days: 'daily' },
  { id: 'healthy-eat', name: 'Ate Well Today',        meta: 'One good swap counts',           emoji: '🥗', color: '#52a869', days: 'daily' },
  { id: 'sleep',       name: 'In Bed by 10pm',        meta: 'Lights out · 8hrs target',       emoji: '😴', color: '#6b52c8', days: 'daily' },
  { id: 'no-screens',  name: 'No Screens After 9:30', meta: 'Wind-down buffer',               emoji: '🌅', color: '#c47d2b', days: 'daily' },
  { id: 'job-search',  name: 'Job Search Block',      meta: '4:00pm · 30 min · Tue/Thu',      emoji: '💼', color: '#2e7fa8', days: [2,4] },
  { id: 'social',      name: 'Social Rep',            meta: 'One connection this week',        emoji: '🤝', color: '#8a6d3b', days: [6] },
  { id: 'meal-prep',   name: 'Meal Prep',             meta: '9am – 10:30am · Sunday',         emoji: '🥘', color: '#b54a3a', days: [0] },
];

function getTodayKey() {
  return new Date().toISOString().slice(0, 10);
}

function getStorage() {
  try {
    const raw = localStorage.getItem('newlease_v1');
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveStorage(data) {
  try { localStorage.setItem('newlease_v1', JSON.stringify(data)); } catch {}
}

function getTodayHabits() {
  const dow = new Date().getDay(); // 0=Sun
  return HABITS.filter(h => h.days === 'daily' || h.days.includes(dow));
}

function isChecked(habitId) {
  const store = getStorage();
  const key = getTodayKey();
  return !!(store[key] && store[key][habitId]);
}

function toggleHabit(habitId, cardEl) {
  const store = getStorage();
  const key = getTodayKey();
  if (!store[key]) store[key] = {};
  const wasChecked = !!store[key][habitId];
  store[key][habitId] = !wasChecked;
  saveStorage(store);

  if (!wasChecked) {
    cardEl.classList.add('done');
    spawnBurst(cardEl);
  } else {
    cardEl.classList.remove('done');
  }
  updateProgress();
}

function spawnBurst(el) {
  const emojis = ['✨','🔥','⚡','💥','🎯'];
  const rect = el.getBoundingClientRect();
  const burst = document.createElement('div');
  burst.className = 'burst';
  burst.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  burst.style.left = (rect.left + rect.width / 2 - 12) + 'px';
  burst.style.top = (rect.top + rect.height / 2 - 12) + 'px';
  document.body.appendChild(burst);
  setTimeout(() => burst.remove(), 700);
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  return days;
}

function getStreak() {
  const store = getStorage();
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const dow = d.getDay();
    const dayHabits = HABITS.filter(h => h.days === 'daily' || h.days.includes(dow));
    if (!dayHabits.length) { streak++; continue; }
    const checked = store[key] ? dayHabits.filter(h => store[key][h.id]).length : 0;
    if (checked === dayHabits.length) streak++;
    else if (i === 0) break; // today incomplete, don't break streak yet if yesterday was full
    else break;
  }
  return streak;
}

function updateProgress() {
  const todayHabits = getTodayHabits();
  const done = todayHabits.filter(h => isChecked(h.id)).length;
  const total = todayHabits.length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('done-count').textContent = done;
  document.getElementById('total-count').textContent = total;
  document.getElementById('total-streak').textContent = getStreak();

  const banner = document.getElementById('all-done-banner');
  if (done === total && total > 0) banner.classList.add('show');
  else banner.classList.remove('show');
}

function renderToday() {
  const list = document.getElementById('habits-list');
  list.innerHTML = '';
  const todayHabits = getTodayHabits();
  const days7 = getLast7Days();
  const store = getStorage();

  todayHabits.forEach(habit => {
    const checked = isChecked(habit.id);

    // build week dots
    const dotsHtml = days7.map((dayKey, i) => {
      const dow = new Date(dayKey + 'T12:00:00').getDay();
      const relevant = habit.days === 'daily' || habit.days.includes(dow);
      const isToday = i === 6;
      if (!relevant) return `<div class="dot" style="opacity:0.2"></div>`;
      const filled = store[dayKey] && store[dayKey][habit.id];
      if (isToday) return `<div class="dot ${filled ? 'filled' : 'today'}" style="--color:${habit.color}"></div>`;
      return `<div class="dot ${filled ? 'filled' : ''}" style="--color:${habit.color}"></div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'habit-card' + (checked ? ' done' : '');
    card.style.setProperty('--color', habit.color);
    card.innerHTML = `
      <div class="habit-emoji">${habit.emoji}</div>
      <div class="habit-info">
        <div class="habit-name">${habit.name}</div>
        <div class="habit-meta">${habit.meta}</div>
        <div class="week-dots">${dotsHtml}</div>
      </div>
      <div class="check-circle">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2.5 7L5.5 10L11.5 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    `;
    card.addEventListener('click', () => toggleHabit(habit.id, card));
    list.appendChild(card);
  });

  updateProgress();
}

function renderStats() {
  const store = getStorage();
  const days7 = getLast7Days();
  const today = getTodayKey();

  // total days tracked
  const allDays = Object.keys(store).length;
  // total completions
  let totalChecks = 0;
  Object.values(store).forEach(day => { totalChecks += Object.values(day).filter(Boolean).length; });
  // perfect days
  let perfectDays = 0;
  Object.entries(store).forEach(([dateKey, dayData]) => {
    const d = new Date(dateKey + 'T12:00:00');
    const dow = d.getDay();
    const dayHabits = HABITS.filter(h => h.days === 'daily' || h.days.includes(dow));
    if (dayHabits.length && dayHabits.every(h => dayData[h.id])) perfectDays++;
  });

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${getStreak()}</div>
      <div class="stat-label">Day Streak</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${perfectDays}</div>
      <div class="stat-label">Perfect Days</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${totalChecks}</div>
      <div class="stat-label">Total Check-ins</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${allDays}</div>
      <div class="stat-label">Days Tracked</div>
    </div>
  `;

  const historyEl = document.getElementById('habit-history');
  historyEl.innerHTML = '';
  const DAY_LETTERS = ['S','M','T','W','T','F','S'];

  HABITS.forEach(habit => {
    let streak = 0;
    for (let i = days7.length - 1; i >= 0; i--) {
      const dk = days7[i];
      const dow = new Date(dk + 'T12:00:00').getDay();
      const relevant = habit.days === 'daily' || habit.days.includes(dow);
      if (relevant && store[dk] && store[dk][habit.id]) streak++;
      else if (relevant) break;
    }

    const barsHtml = days7.map(dayKey => {
      const dow = new Date(dayKey + 'T12:00:00').getDay();
      const relevant = habit.days === 'daily' || habit.days.includes(dow);
      const filled = relevant && store[dayKey] && store[dayKey][habit.id];
      return `<div class="week-bar-day ${filled ? 'filled' : ''}" style="${filled ? `background:${habit.color};color:white` : ''}">
        <span class="day-letter">${DAY_LETTERS[dow]}</span>
        ${filled ? '✓' : relevant ? '·' : ''}
      </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'history-card';
    card.innerHTML = `
      <div class="history-top">
        <div class="history-name">${habit.emoji} ${habit.name}</div>
        <div class="history-streak" style="color:${habit.color}">${streak}<span style="font-size:11px;color:var(--muted);font-family:'Manrope',sans-serif;font-weight:600"> this wk</span></div>
      </div>
      <div class="week-bar">${barsHtml}</div>
    `;
    historyEl.appendChild(card);
  });
}

function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.getElementById('nav-' + view).classList.add('active');
  if (view === 'stats') renderStats();
}

// Init
const now = new Date();
document.getElementById('date-label').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
renderToday();
</script>

</body>
</html>
