/* === Stripe-like polish pass: white + olive === */
:root{
  --bg:#fbfcfd;
  --panel:#ffffff;
  --soft:#f7f9f6;
  --soft2:#eef4ea;
  --text:#101210;
  --muted:#667063;
  --line:#dfe6dc;
  --olive:#053229;
  --olive2:#7d8c70;
  --oliveSoft:#eef5ea;
  --danger:#a44f4f;
  --shadow:0 18px 45px rgba(31,41,27,.08),0 2px 6px rgba(31,41,27,.04);
}
body{background:
  radial-gradient(circle at 18% -8%, rgba(5,50,41,.09), transparent 30%),
  linear-gradient(180deg,#fff 0%,#fbfcfd 58%,#f7f9f6 100%) !important;}
.app-shell{background:rgba(255,255,255,0) !important;box-shadow:0 0 0 1px rgba(16,18,16,.03),0 30px 90px rgba(31,41,27,.10);}
.view{padding-top:20px;}
.top{padding:4px 1px 2px;margin-bottom:16px;}
.eyebrow{color:var(--olive);letter-spacing:.16em;}
.title{font-size:32px;font-weight:800;letter-spacing:-.055em;}
.date-pill{background:#fff;border-color:rgba(5,50,41,.16);box-shadow:0 1px 2px rgba(31,41,27,.04);}
.card,.tile,.stat-card,.exercise,.quote-card,.hero{box-shadow:var(--shadow);border-color:rgba(5,50,41,.14);}
.card{background:linear-gradient(180deg,#fff,#fcfdfb);}
.card.soft{background:linear-gradient(180deg,#f9fbf7,#f4f7f1);}
.quote-card{background:
  linear-gradient(135deg,rgba(255,255,255,.98),rgba(247,250,245,.95)),
  radial-gradient(circle at 100% 0%,rgba(5,50,41,.12),transparent 34%);border-radius:26px;padding:19px 18px;}
.quote-card:after{background:linear-gradient(135deg,rgba(5,50,41,.12),rgba(5,50,41,0));}
.quote-kicker,.stat-kicker,.label{color:var(--olive);}
.hero{background:
  radial-gradient(circle at 88% 0%,rgba(5,50,41,.16),transparent 36%),
  linear-gradient(135deg,#ffffff 0%,#f7faf5 54%,#eef5ea 100%);border-radius:30px;padding:22px;}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.85),rgba(255,255,255,0) 42%);pointer-events:none;}
.hero:after{background:rgba(5,50,41,.10);filter:blur(1px);}
.hero-num{font-size:64px;letter-spacing:-.075em;color:var(--olive);}
.hero-sub{color:#586252;}
.bar{height:9px;background:#edf2ea;box-shadow:inset 0 1px 2px rgba(31,41,27,.06);}
.bar>span{background:linear-gradient(90deg,#7d8c70,#053229);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset;}
.tile{background:linear-gradient(180deg,#fff,#fbfdf9);border-radius:22px;padding:17px;position:relative;overflow:hidden;}
.tile:before{content:"";position:absolute;right:-24px;top:-30px;width:90px;height:90px;border-radius:999px;background:rgba(5,50,41,.055);}
.tile-title,.history-title,.habit-name,.ex-name{letter-spacing:-.025em;}
.tile-stat{font-size:31px;color:var(--olive);position:relative;z-index:1;}
.tile-meta,.muted,.history-meta,.stat-sub{color:var(--muted);}
.day-row{background:linear-gradient(135deg,#fff,#f7faf5);border-color:rgba(5,50,41,.14);box-shadow:0 10px 28px rgba(31,41,27,.06);}
.habit-card{padding:15px 0;transition:background .15s ease, transform .15s ease;}
.habit-card:active{transform:scale(.993);}
.habit-visual{background:linear-gradient(135deg,#eef5ea,#f8fbf6);box-shadow:inset 0 0 0 1px rgba(5,50,41,.10);}
.check{background:#fff;box-shadow:0 1px 2px rgba(31,41,27,.05);}
.btn{box-shadow:0 1px 2px rgba(31,41,27,.04);transition:transform .14s ease, box-shadow .14s ease, background .14s ease;}
.btn:active{transform:scale(.98);}
.btn.primary{background:linear-gradient(180deg,#6f8060,#053229);box-shadow:0 10px 22px rgba(5,50,41,.18);}
.exercise{border-radius:24px;background:#fff;overflow:hidden;}
.ex-head{background:linear-gradient(180deg,#f9fbf7,#f2f7ef);}
.set-row{transition:background .12s ease;}.set-row:focus-within{background:#fafcf8;}
.set-done.done{background:linear-gradient(180deg,#6f8060,#053229);box-shadow:0 6px 16px rgba(5,50,41,.18);}
.stat-card{background:linear-gradient(180deg,#fff,#fbfdf9);border-radius:22px;position:relative;overflow:hidden;}
.stat-card:after{content:"";position:absolute;right:-32px;top:-38px;width:105px;height:105px;border-radius:999px;background:rgba(5,50,41,.03);}
.stat-big{position:relative;z-index:1;color:var(--olive);}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px;}
.bar-col{flex:1;min-width:0;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#c8d4bf,#aebda3);position:relative;display:flex;align-items:flex-end;justify-content:center;}
.bar-col span{position:absolute;bottom:-22px;font-size:10px;color:var(--muted);font-weight:750;}
.bar-col.hot{background:linear-gradient(180deg,#7d8c70,#053229);}
.chart-mini svg{filter:drop-shadow(0 10px 18px rgba(5,50,41,.10));}
.nav{background:rgba(255,255,255,.86);backdrop-filter:blur(22px);border-top-color:rgba(5,50,41,.14);box-shadow:0 -16px 36px rgba(31,41,27,.06);}
.nav button{transition:color .14s ease, transform .14s ease;}.nav button:active{transform:translateY(1px)}
.modal{background:rgba(16,18,16,.20);}.sheet{box-shadow:0 -24px 70px rgba(31,41,27,.16);}



/* === Full redesign: dusky pink + olive, no circle tile decorations === */
:root{
  --bg:#fcfcfc;
  --panel:#ffffff;
  --soft:#f8f8f7;
  --soft2:#f1f3ef;
  --text:#0b0b0c;
  --muted:#6e716b;
  --line:#e6e7e4;
  --olive:#053229;
  --olive2:#7f8b73;
  --oliveSoft:#eef3ea;
  --pink:#E3AD56;
  --pink2:#d7a7ad;
  --pinkSoft:#f8eef0;
  --danger:#a44f4f;
  --shadow:0 10px 30px rgba(20,24,18,.055),0 1px 2px rgba(20,24,18,.045);
  --shadow2:0 18px 48px rgba(20,24,18,.075),0 2px 6px rgba(20,24,18,.04);
}
body{background:linear-gradient(180deg,#fff 0%,#fcfcfc 54%,#f7f8f6 100%) !important;}
.app-shell{background:#fff !important;box-shadow:0 0 0 1px rgba(10,10,12,.035),0 24px 80px rgba(20,24,18,.06)!important;}
.eyebrow{color:var(--olive)!important}.title{color:var(--text)}.date-pill{background:#fff;border-color:var(--line);box-shadow:0 1px 2px rgba(10,10,12,.035);}
.card,.tile,.stat-card,.exercise,.quote-card,.hero{border-color:var(--line)!important;box-shadow:var(--shadow)!important;background:#fff!important;}
.card.soft{background:var(--soft)!important;}
/* Remove decorative circle blobs everywhere */
.quote-card:after,.hero:after,.hero:before,.tile:before,.stat-card:after{display:none!important;content:none!important;}
.quote-card{border-radius:22px!important;padding:18px!important;background:linear-gradient(180deg,#fff,#fffafa)!important;}
.quote-kicker,.label{color:var(--olive)!important}.stat-kicker{color:var(--muted)!important;}
.quote{color:#272923!important;font-weight:650!important}.quote-author{color:var(--muted)!important;}
/* Dashboard hero: data block, not illustrated card */
.hero{border-radius:22px!important;padding:20px!important;background:linear-gradient(180deg,#fff,#fbfbfa)!important;position:relative;}
.hero:before{display:block!important;content:""!important;position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--olive),var(--pink));border-radius:22px 0 0 22px;}
.hero-main{position:relative;z-index:1}.hero-num{font-size:62px!important;color:var(--olive)!important;font-weight:760!important;letter-spacing:-.075em!important;}
.hero-sub{color:var(--muted)!important;font-weight:650!important;}
.bar{height:7px!important;background:#edeFec!important;box-shadow:none!important;}
.bar>span{background:linear-gradient(90deg,var(--olive),var(--pink))!important;box-shadow:none!important;}
/* Stripe-like tiles: label/value/content only */
.tile{border-radius:18px!important;padding:16px!important;overflow:hidden!important;background:linear-gradient(180deg,#fff,#fcfcfb)!important;transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease!important;}
.tile:hover{border-color:#d8dbd5!important;box-shadow:var(--shadow2)!important}.tile:active{transform:scale(.985)!important;}
.tile-stat{font-size:30px!important;line-height:1!important;margin:0 0 10px!important;color:var(--olive)!important;font-weight:760!important;letter-spacing:-.055em!important;}
.grid2 .tile:nth-child(2) .tile-stat{color:var(--pink)!important;}
.tile-title{font-size:15px!important;font-weight:720!important;color:var(--text)!important;}
.tile-meta{font-size:12px!important;color:var(--muted)!important;line-height:1.42!important;}
/* Habit visuals become designed badges, not circular icons */

function renderHabits(){const pct=habitPct();const log=state.habitLog[todayKey()]||{};document.getElementById('view-habits').innerHTML=topHtml('Habits','Daily system')+`
  <div class="day-row"><div class="day-left"><div class="day-name">${new Date().toLocaleDateString('en-US',{weekday:'long'})}</div><div class="day-date">${todayKey()}</div></div><div class="day-progress"><div class="pct">${pct}%</div><div class="bar"><span style="width:${pct}%"></span></div></div></div>
  <div class="habit-toolbar"><div class="label" style="margin:0">Today's habits</div><button class="btn small primary" onclick="openHabitModal()">+ Add</button></div>
  <div class="card">${state.habits.map(h=>`<div class="habit-card ${log[h.id]?'done':''}"><div class="habit-visual" onclick="toggleHabit('${h.id}')">${iconSvg(h.icon)}</div><div class="habit-body" onclick="toggleHabit('${h.id}')"><div class="habit-name">${escapeHtml(h.name)}</div><div class="habit-meta">${escapeHtml(h.meta||'No cue yet')}</div></div><div class="habit-actions"><button class="edit-btn" onclick="openHabitModal('${h.id}')" aria-label="Edit habit">✎</button><div class="check" onclick="toggleHabit('${h.id}')">${log[h.id]?'✓':''}</div></div></div>`).join('')||'<div class="empty">No habits yet.</div>'}</div>`}
function toggleHabit(id){const k=todayKey();state.habitLog[k]=state.habitLog[k]||{};state.habitLog[k][id]=!state.habitLog[k][id];save();render()}
function openHabitModal(id=null){editingHabitId=id;const h=id?state.habits.find(x=>x.id===id):null;selectedIcon=h?.icon||'leaf';document.getElementById('habitModalTitle').textContent=id?'Edit habit':'Add habit';document.getElementById('habitNameInput').value=h?.name||'';document.getElementById('habitMetaInput').value=h?.meta||'';document.getElementById('deleteHabitBtn').style.display=id?'block':'none';renderIconPicker();document.getElementById('habitModal').classList.add('show');setTimeout(()=>document.getElementById('habitNameInput').focus(),80)}
function renderIconPicker(){const picker=document.getElementById('iconPicker');picker.innerHTML=Object.keys(iconSet).map(k=>`<button class="icon-choice ${k===selectedIcon?'selected':''}" onclick="selectIcon('${k}')">${iconSvg(k)}</button>`).join('')}
function selectIcon(k){selectedIcon=k;renderIconPicker()}
function hideHabitModal(){document.getElementById('habitModal').classList.remove('show')}
function closeHabitModal(e){if(e.target.id==='habitModal')hideHabitModal()}
function saveHabitFromModal(){const name=document.getElementById('habitNameInput').value.trim();const meta=document.getElementById('habitMetaInput').value.trim();if(!name){alert('Add a habit name.');return}if(editingHabitId){const h=state.habits.find(x=>x.id===editingHabitId);if(h){h.name=name;h.meta=meta;h.icon=selectedIcon}}else{state.habits.push({id:'h'+Date.now(),name,meta,icon:selectedIcon})}save();hideHabitModal();render()}
function deleteCurrentHabit(){if(!editingHabitId)return;state.habits=state.habits.filter(h=>h.id!==editingHabitId);Object.values(state.habitLog).forEach(day=>delete day[editingHabitId]);save();hideHabitModal();render()}
function renderWorkout(){document.getElementById('view-workout').innerHTML=topHtml('Workout','Strength log')+`
  <div class="stack">${state.exercises.map(ex=>exerciseHtml(ex)).join('')}</div><div class="session-actions"><button class="btn ghost" onclick="resetWorkoutInputs()">Clear</button><button class="btn primary" onclick="saveWorkout()">Save session</button></div>
  <div class="label">Recent sessions</div><div class="card">${state.workouts.length?state.workouts.slice(0,8).map(w=>`<div class="history-item editable"><div><div class="history-title">${escapeHtml(w.dateLabel||w.stamp||w.date||'Workout')}</div><div class="history-meta">${w.sets} sets · ${w.exercises} exercises</div></div><div class="history-value">${w.volume}</div><div class="history-actions"><button class="btn" onclick="editWorkout(${w.id})">Edit</button><button class="btn danger" onclick="deleteWorkout(${w.id})">Delete</button></div></div>`).join(''):'<div class="empty">No workouts saved yet.</div>'}</div>`}
function exerciseHtml(ex){return `<div class="exercise"><div class="ex-head"><div><div class="ex-name">${escapeHtml(ex.name)}</div><div class="ex-target">${escapeHtml(ex.target)}</div></div></div><div class="set-head"><div>Set</div><div>Reps</div><div>Weight</div><div></div></div>${[1,2,3].map(i=>`<div class="set-row"><div class="set-num">${i}</div><input inputmode="numeric" id="${ex.id}-r-${i}" placeholder="0"><input inputmode="decimal" id="${ex.id}-w-${i}" placeholder="0"><button class="set-done" onclick="markSet(this)">✓</button></div>`).join('')}</div>`}
function markSet(btn){btn.classList.toggle('done');startTimer(90)}
function resetWorkoutInputs(){document.querySelectorAll('#view-workout input').forEach(i=>i.value='');document.querySelectorAll('.set-done').forEach(b=>b.classList.remove('done'))}
function saveWorkout(){let sets=0,volume=0,exCount=0,details=[];state.exercises.forEach(ex=>{let exSets=0,setRows=[];[1,2,3].forEach(i=>{const r=+document.getElementById(`${ex.id}-r-${i}`)?.value||0;const w=+document.getElementById(`${ex.id}-w-${i}`)?.value||0;if(r||w){sets++;exSets++;volume+=r*w;setRows.push({set:i,reps:r,weight:w})}});if(exSets){exCount++;details.push({id:ex.id,name:ex.name,sets:exSets,rows:setRows})}});if(!sets){alert('Enter at least one set.');return}state.workouts.unshift({id:Date.now(),date:todayKey(),dateLabel:fullStamp(),sets,volume,exercises:exCount,details});save();resetWorkoutInputs();render()}
function editWorkout(id){const w=state.workouts.find(x=>x.id===id);if(!w)return;const volume=prompt('Workout volume',w.volume);if(volume===null)return;const sets=prompt('Number of sets',w.sets);if(sets===null)return;const exercises=prompt('Number of exercises',w.exercises);if(exercises===null)return;const stamp=prompt('Date / time label',w.dateLabel||fullStamp());if(stamp===null)return;w.volume=Number(volume)||0;w.sets=Number(sets)||0;w.exercises=Number(exercises)||0;w.dateLabel=stamp.trim()||w.dateLabel;w.editedAt=fullStamp();save();render()}
function deleteWorkout(id){if(!confirm('Delete this workout entry?'))return;state.workouts=state.workouts.filter(x=>x.id!==id);save();render()}
function renderStats(){
  const pct=habitPct();
  const habit14=habitSeries(14);
  const last7=habit14.slice(-7);
  const weeklyAvg=Math.round(last7.reduce((a,d)=>a+d.value,0)/(last7.length||1));
  const streak=currentStreak();
  const perfect=perfectDays(30);
  const w7=workoutsInDays(7);
  const volume7=w7.reduce((a,w)=>a+(Number(w.volume)||0),0);
  const workoutSeries=workoutVolumeSeries(14);
  const lastWeight=state.weightLogs[state.weightLogs.length-1];
  const prevWeight=state.weightLogs[state.weightLogs.length-2];
  const weightDelta=(lastWeight&&prevWeight)?(Number(lastWeight.weight)-Number(prevWeight.weight)):null;
  const latestMeasurement=state.measurementLogs[state.measurementLogs.length-1];
  document.getElementById('view-stats').innerHTML=topHtml('Stats','Progress')+`
    <div class="stats-hero">
      <div class="stat-card"><div class="stat-kicker">Current streak</div><div class="stat-big">${streak}</div><div class="stat-sub">perfect day${streak===1?'':'s'} in a row</div></div>
      <div class="stat-card"><div class="stat-kicker">7-day habits</div><div class="stat-big">${weeklyAvg}%</div><div class="stat-sub">average completion</div></div>
      <div class="stat-card"><div class="stat-kicker">Workouts</div><div class="stat-big">${w7.length}</div><div class="stat-sub">sessions in last 7 days</div></div>
      <div class="stat-card"><div class="stat-kicker">Volume</div><div class="stat-big">${formatNum(volume7)}</div><div class="stat-sub">lbs moved this week</div></div>
    </div>

    <div class="label">Habit consistency</div>
    <div class="card">
      <div class="chart-title"><strong>Last 14 days</strong><span>${perfect} perfect days<br>in last 30</span></div>
      <div class="bars compact">${habit14.map(d=>`<div class="bar-col ${d.value>=100?'hot':''}" style="height:${Math.max(8,d.value)}%"><span>${d.label}</span></div>`).join('')}</div>
    </div>

    <div class="label">Workout volume</div>
    <div class="card">
      <div class="chart-title"><strong>Last 14 days</strong><span>${state.workouts.length} total<br>saved sessions</span></div>
      ${barChart(workoutSeries,'volume')}
    </div>

    <div class="label">Weight trend</div>
    <div class="card">
      <div class="chart-title"><strong>${lastWeight?`${lastWeight.weight} lbs`:'No weight yet'}</strong><span>${weightDelta===null?'Log twice for change':`${weightDelta>0?'+':''}${weightDelta.toFixed(1)} lbs since prior`}</span></div>
      ${lineChart(state.weightLogs.map(x=>Number(x.weight)).filter(Boolean))}
    </div>

    <div class="label">Body measurements</div>
    <div class="card">
      ${latestMeasurement?measurementSummary(latestMeasurement):'<div class="empty">Log measurements in Profile to track changes.</div>'}
    </div>

    <div class="label">Recent activity</div>
    <div class="card"><div class="insight-list">
      <div class="insight"><div><div class="insight-main">Today</div><div class="insight-meta">Habit completion</div></div><div class="insight-value">${pct}%</div></div>
      <div class="insight"><div><div class="insight-main">Last workout</div><div class="insight-meta">${state.workouts[0]?.dateLabel||'No sessions yet'}</div></div><div class="insight-value">${state.workouts[0]?formatNum(state.workouts[0].volume):'—'}</div></div>
      <div class="insight"><div><div class="insight-main">Profile logs</div><div class="insight-meta">Weight + measurements</div></div><div class="insight-value">${state.weightLogs.length+state.measurementLogs.length}</div></div>
    </div></div>`
}
function habitSeries(days){return [...Array(days)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(days-1-i));const k=todayKey(d);const done=Object.values(state.habitLog[k]||{}).filter(Boolean).length;return {key:k,label:d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,1),value:state.habits.length?Math.round(done/state.habits.length*100):0}})}
function currentStreak(){let streak=0;for(let i=0;i<365;i++){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);const log=state.habitLog[k]||{};const done=state.habits.filter(h=>log[h.id]).length;if(state.habits.length&&done===state.habits.length)streak++;else break}return streak}
function perfectDays(days){let n=0;for(let i=0;i<days;i++){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);const log=state.habitLog[k]||{};if(state.habits.length&&state.habits.every(h=>log[h.id]))n++}return n}
function workoutsInDays(days){const cutoff=new Date();cutoff.setDate(cutoff.getDate()-(days-1));const ck=todayKey(cutoff);return state.workouts.filter(w=>(w.date||'')>=ck)}
function workoutVolumeSeries(days){return [...Array(days)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(days-1-i));const k=todayKey(d);const volume=state.workouts.filter(w=>w.date===k).reduce((a,w)=>a+(Number(w.volume)||0),0);return {key:k,label:d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,1),value:volume}})}
function formatNum(n){n=Number(n)||0;return n>=1000?`${Math.round(n/100)/10}k`:String(Math.round(n))}
function barChart(series){const max=Math.max(...series.map(x=>x.value),1);return `<div class="bars compact">${series.map(d=>`<div class="bar-col ${d.value? 'hot':''}" style="height:${Math.max(8,(d.value/max)*100)}%"><span>${d.label}</span></div>`).join('')}</div>`}
function lineChart(vals){if(vals.length<2)return '<div class="empty">Log weight twice to see a trend.</div>';const v=vals.slice(-10),min=Math.min(...v),max=Math.max(...v),range=max-min||1;const pts=v.map((x,i)=>`${(i/(v.length-1))*300},${120-((x-min)/range)*96}`).join(' ');const area=`0,130 ${pts} 300,130`;return `<svg class="chart chart-mini" viewBox="0 0 300 140"><line class="grid" x1="0" y1="120" x2="300" y2="120"/><polygon class="chart-area" points="${area}"/><polyline points="${pts}"/>${v.map((x,i)=>`<circle class="chart-dot" cx="${(i/(v.length-1))*300}" cy="${120-((x-min)/range)*96}" r="3"/>`).join('')}</svg><div class="chart-labels"><span>${v[0]} lbs</span><span>${v[v.length-1]} lbs</span></div>`}
function measurementSummary(m){const fields=[['Chest',m.chest],['Waist',m.waist],['Hips',m.hips],['Arms',m.arms],['Legs',m.legs]].filter(x=>x[1]);return `<div class="chart-title"><strong>Latest check-in</strong><span>${escapeHtml(m.stamp||'')}</span></div><div class="insight-list">${fields.map(([name,val])=>`<div class="insight"><div><div class="insight-main">${name}</div><div class="insight-meta">Current measurement</div></div><div class="insight-value">${escapeHtml(val)}</div></div>`).join('')||'<div class="empty">No measurement values saved.</div>'}</div>`}
function renderProfile(){document.getElementById('view-profile').innerHTML=topHtml('Profile','Logs')+`
  <div class="card"><div class="tile-title">Weight</div><div class="profile-note">Each entry captures the exact date and time it was logged. You can edit or delete any entry later.</div><div class="form-row"><input id="weightInput" type="number" inputmode="decimal" placeholder="Weight"><button class="btn primary" onclick="saveWeight()">Log</button></div><div class="profile-log">${state.weightLogs.slice().reverse().slice(0,10).map(w=>`<div class="history-item editable"><div><div class="history-title">${w.weight} lbs</div><div class="history-meta">${escapeHtml(w.stamp||'')}</div></div><div class="history-actions"><button class="btn" onclick="editWeight(${w.ts})">Edit</button><button class="btn danger" onclick="deleteWeight(${w.ts})">Delete</button></div></div>`).join('')||'<div class="empty">No weight logs.</div>'}</div></div>
  <div class="label">Measurements</div><div class="card"><div class="profile-note">Track arms, legs, chest, waist, and hips with date/time stamps. Entries remain editable.</div><div class="form-row"><input id="mChest" placeholder="Chest"><input id="mWaist" placeholder="Waist"><input id="mHips" placeholder="Hips"><input id="mArms" placeholder="Arms"><input id="mLegs" placeholder="Legs"><button class="btn primary" onclick="saveMeasurements()">Log</button></div><div class="profile-log">${state.measurementLogs.slice().reverse().slice(0,8).map(m=>`<div class="history-item editable"><div><div class="history-title">${escapeHtml(m.stamp||'')}</div><div class="history-meta">Chest ${escapeHtml(m.chest||'-')} · Waist ${escapeHtml(m.waist||'-')} · Hips ${escapeHtml(m.hips||'-')} · Arms ${escapeHtml(m.arms||'-')} · Legs ${escapeHtml(m.legs||'-')}</div></div><div class="history-actions"><button class="btn" onclick="editMeasurement(${m.ts})">Edit</button><button class="btn danger" onclick="deleteMeasurement(${m.ts})">Delete</button></div></div>`).join('')||'<div class="empty">No measurement logs.</div>'}</div></div>`}
function saveWeight(){const val=+document.getElementById('weightInput').value;if(!val)return;state.weightLogs.push({weight:val,date:todayKey(),stamp:fullStamp(),ts:Date.now()});save();render()}
function editWeight(ts){const w=state.weightLogs.find(x=>x.ts===ts);if(!w)return;const next=prompt('Weight',w.weight);if(next===null)return;const stamp=prompt('Date / time',w.stamp||fullStamp());if(stamp===null)return;w.weight=Number(next)||w.weight;w.stamp=stamp.trim()||w.stamp;w.editedAt=fullStamp();save();render()}
function deleteWeight(ts){if(!confirm('Delete this weight entry?'))return;state.weightLogs=state.weightLogs.filter(x=>x.ts!==ts);save();render()}
function saveMeasurements(){state.measurementLogs.push({date:todayKey(),stamp:fullStamp(),ts:Date.now(),chest:val('mChest'),waist:val('mWaist'),hips:val('mHips'),arms:val('mArms'),legs:val('mLegs')});save();render()}
function editMeasurement(ts){const m=state.measurementLogs.find(x=>x.ts===ts);if(!m)return;const stamp=prompt('Date / time',m.stamp||fullStamp());if(stamp===null)return;m.stamp=stamp.trim()||m.stamp;const chest=prompt('Chest',m.chest||'');if(chest===null)return;const waist=prompt('Waist',m.waist||'');if(waist===null)return;const hips=prompt('Hips',m.hips||'');if(hips===null)return;const arms=prompt('Arms',m.arms||'');if(arms===null)return;const legs=prompt('Legs',m.legs||'');if(legs===null)return;Object.assign(m,{chest,waist,hips,arms,legs,editedAt:fullStamp()});save();render()}
function deleteMeasurement(ts){if(!confirm('Delete this measurement entry?'))return;state.measurementLogs=state.measurementLogs.filter(x=>x.ts!==ts);save();render()}
function val(id){return document.getElementById(id).value||''}
function startTimer(sec){timerLeft=sec;timerPaused=false;document.getElementById('timer').classList.add('show');document.getElementById('pauseBtn').textContent='Pause';tickTimer();clearInterval(timerInt);timerInt=setInterval(()=>{if(!timerPaused){timerLeft--;tickTimer();if(timerLeft<=0)skipTimer()}},1000)}
function tickTimer(){const m=Math.floor(timerLeft/60),s=timerLeft%60;document.getElementById('timerTime').textContent=`${m}:${String(s).padStart(2,'0')}`}
function toggleTimer(){timerPaused=!timerPaused;document.getElementById('pauseBtn').textContent=timerPaused?'Resume':'Pause'}
function skipTimer(){clearInterval(timerInt);document.getElementById('timer').classList.remove('show')}
function escapeHtml(str=''){return String(str).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
render();
</script>

<script>
document.addEventListener("click", function(e){
  const btn = e.target.closest(".nav-btn");
  if(!btn) return;
  const text = (btn.textContent || "").trim().toLowerCase();
  const map = {dashboard:"8%", habits:"28%", workout:"50%", stats:"72%", profile:"92%"};
  document.documentElement.style.setProperty("--nav-shift", map[text] || "8%");
});
</script>

</body>
</html>
